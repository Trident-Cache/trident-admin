# Trident Admin Dashboard - nginx snippet
#
# Include this in your site's HTTPS server block BEFORE the main location / block.
# See HOWTO.md for full setup instructions.
#
# Usage in your server block:
#   server {
#       listen 443 ssl http2;
#       server_name your-domain.com;
#
#       include /etc/nginx/snippets/trident-admin.conf;
#
#       location / {
#           proxy_pass http://127.0.0.1:8120;  # Trident cache proxy
#           proxy_set_header Authorization "";  # IMPORTANT: see below
#           # ... other proxy settings ...
#       }
#   }
#
# IMPORTANT: You MUST add 'proxy_set_header Authorization "";' to your main
# location / block. Without it, browsers will send basic auth credentials on
# ALL requests to the domain after logging into the admin panel, which prevents
# Trident from caching any responses.

# Create the password file with:
#   apt install -y apache2-utils
#   htpasswd -cb /etc/nginx/.htpasswd-trident admin yourpassword

# SSE (Server-Sent Events) endpoint
# Needs special proxy settings to prevent buffering and allow long-lived connections.
location /trident-admin/api/events {
    auth_basic "Trident Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-trident;

    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 86400s;
}

# Admin dashboard
location /trident-admin {
    auth_basic "Trident Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-trident;

    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}
